name: Build Keyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q ReverseCalcKeyboard_v3_GitHub.zip -d project

      - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          echo "Found Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLEW")"
          "$PWD/gradlew" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReverseCalcKeyboard-APK
          path: '**/build/outputs/apk/debug/*.apk'
