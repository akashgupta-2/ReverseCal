name: Build toraco-key APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Gradle project
        shell: bash
        run: |
          echo "Checking project files..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Gradle project verified."

      - name: Build toraco-key V5.2
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -maxdepth 6 -type f | sort || true
            exit 1
          fi

          echo "APK found: $APK"

      - name: Upload toraco-key V5.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-v5.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
