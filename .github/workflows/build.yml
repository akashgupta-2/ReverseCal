name: Build toraco-key V5.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(find project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
           
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find project/final -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" toraco-key-V5.2.apk

      - name: Upload toraco-key V5.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-V5.2-APK
          path: toraco-key-V5.2.apk
