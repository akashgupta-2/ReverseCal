name: Build toraco-key V5.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q toraco-key-V5.2-GBOARD-layout.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd project/final
          gradle assembleDebug

      - name: Find APK
        run: |
          APK=$(find project/final -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find project/final -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" toraco-key-V5.2.apk

      - name: Upload toraco-key V5.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-V5.2-APK
          path: toraco-key-V5.2.apk
