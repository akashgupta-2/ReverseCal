name: Build Toraco Key V5.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "App directory:"
          ls -la app

      - name: Build APK
        run: |
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find . -type f | grep -E '\.apk$|build|outputs' || true
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" toraco-key-v5.3.apk

      - name: Upload Toraco Key V5.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-v5.3-APK
          path: toraco-key-v5.3.apk
