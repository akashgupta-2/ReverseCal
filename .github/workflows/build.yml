name: Build toraco-key APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          echo "Files in repository:"
          ls -la

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found!"
            exit 1
          fi

          echo "Extracting: $ZIP"
          unzip -o "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted \
            -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build toraco-key
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          gradle assembleDebug --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find extracted \
            -type f \
            -name "app-debug.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload toraco-key APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-APK
          path: ${{ steps.apk.outputs.apk_path }}
