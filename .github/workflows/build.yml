name: Build toraco-key APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found!"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          mkdir -p project
          unzip -o "$ZIP" -d project

          echo "Extracted project:"
          find project -max          fi

          echo "Found: $ZIP"

          mkdir -p project
          unzip -o "$ZIP" -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | sort

      - name: Verify Gradle project
        run: |
          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts

          echo "Gradle project verified."

      - name: Build toraco-key
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find project -type f -name "*.apk"
            exit 1
          fi

          echo "APK found: $APK"

      - name: Upload toraco-key APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-V5.1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk          name: toraco-key-V5.1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk          unzip -o "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted \
            -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build toraco-key
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          gradle assembleDebug --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find extracted \
            -type f \
            -name "app-debug.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload toraco-key APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-APK
          path: ${{ steps.apk.outputs.apk_path }}
