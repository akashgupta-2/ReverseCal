name: Build ToracoKey V5.3

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.kt'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.kts'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f \
            \( -name 'ToracoKey_V5.3_STABLE_FIXED.zip' -o -name '*.zip' \) \
            | head -n 1)"

          if [ -n "$ZIP" ]; then
            echo "ZIP found: $ZIP"

            mkdir -p extracted
            unzip -q "$ZIP" -d extracted

            SETTINGS="$(find extracted -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              | head -n 1)"

            if [ -n "$SETTINGS" ]; then
              ROOT="$(dirname "$SETTINGS")"
              echo "Gradle project found: $ROOT"
              cp -a "$ROOT"/. .
            fi
          fi

          echo "Project contents:"
          find . -maxdepth 3 -type f | sort | head -n 200

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find . -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT_DIR" -type f \
              | grep -E 'build|outputs|apk' || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/toraco-key-v5.3.apk"

      - name: Upload ToracoKey V5.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-v5.3-APK
          path: toraco-key-v5.3.apk
          if-no-files-found: error
