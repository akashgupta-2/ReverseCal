name: Build toraco-key V5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract toraco-key ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            \( -iname 'toracokey*.zip' -o -iname 'toraco-key*.zip' -o -iname '*.zip' \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted ZIP contents:"
          find extracted -maxdepth 5 -type f | head -200

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find extracted -type f -name gradlew -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          else
            SETTINGS=$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: No Gradle project found"
              echo "Searching extracted files:"
              find extracted -type f | head -300
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR" -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" toraco-key-V5.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-V5.3-APK
          path: toraco-key-V5.3.apk
