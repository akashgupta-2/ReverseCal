name: Build Toraco Key V5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Toraco Key ZIP
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          ls -la

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'ToracoKey_V5.3*.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Toraco Key V5.3 ZIP not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP found: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Gradle version:"
          gradle --version

          echo "Android app:"
          ls -la app

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."

            echo "Searching build outputs:"
            find "$PROJECT_DIR" \
              -type f \
              \( -path "*/build/*" -o -name "*.apk" \) \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "toraco-key-v5.3.apk"

      - name: Upload Toraco Key V5.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-v5.3-APK
          path: toraco-key-v5.3.apk
