name: Build toraco-key V5.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q ReverseCalcKeyboard_V5.3_GBOARD_LAYOUT_FIX.zip -d project

      - name: Find Gradle project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR" -type f | grep -E '\.apk$|build|outputs' || true
            exit 1
          fi
          echo "APK found: $APK"
          cp "$APK" toraco-key-V5.3.apk

      - name: Upload toraco-key V5.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-V5.3-APK
          path: toraco-key-V5.3.apk        uses: gradle/actions/setup-gradle@v4
