name: Build Keyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q ReverseCalcKeyboard_v3_GitHub.zip -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReverseCalcKeyboard-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
