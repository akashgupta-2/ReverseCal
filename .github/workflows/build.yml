name: Build Toraco Key V5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          ls -la

          ZIP=$(find . -maxdepth 2 -type f -name 'ToracoKey_V5.3*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ToracoKey V5.3 ZIP not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP found: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "Extracted files:"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "ERROR: gradlew not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            echo "Build directory contents:"
            find "$PROJECT_DIR" -type f | grep -E 'build|apk|outputs' || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "toraco-key-v5.3.apk"

      - name: Upload Toraco Key V5.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-v5.3-APK
          path: toraco-key-v5.3.apk
