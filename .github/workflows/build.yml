ai_question:
  enabled: true

  trigger:
    question_mark: true
    question_words:
      - what
      - why
      - how
      - when
      - where
      - who
      - which
      - is
      - are
      - can
      - explain
      - define

  answer:
    enabled: true
    show_in_suggestions: true
    max_suggestions: 3

  actions:
    tap_answer: insert
    long_press_answer: copy

keyboard:
  layout: qwerty

  rows:
    - "qwertyuiop"
    - "asdfghjkl"
    - "zxcvbnm"

  alignment:
    third_row:
      gboard: true
      start_below: "s"
      end_below: "k"
