name: Build ToracoKey V5.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -d app

          echo "Project verification successful."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Build output:"
            find "$PROJECT_DIR/app/build" -type f | sort || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/toraco-key-v5.3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-v5.3-APK
          path: toraco-key-v5.3.apk
          if-no-files-found: error
