name: Build toraco-key V5.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build toraco-key V5.2
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find app/build/outputs -maxdepth 5 -type f | sort || true
            exit 1
          fi

          echo "Found APK: $APK"

      - name: Upload toraco-key V5.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-V5.2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          echo "Found ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f | sort | head -300

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS=$(find project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path '*/.git/*' \
            -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD_FILE=$(find project -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -not -path '*/.git/*' \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project found"
            echo ""
            echo "All extracted files:"
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build toraco-key V5.2
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            echo ""
            echo "Searching for any APK:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/toraco-key-V5.2.apk

      - name: Upload toraco-key V5.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-V5.2
          path: release/toraco-key-V5.2.apk
          if-no-files-found: error
