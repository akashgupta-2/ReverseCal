name: Build toraco-key V5.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract toraco-key ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            \( -iname 'toraco-key*.zip' -o -iname '*.zip' \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          mkdir -p project
          unzip -q "$ZIP" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build toraco-key V5.2
        shell: bash
        run: |
          set -e

          ROOT=$(find project -type f -name gradlew -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          DIR=$(dirname "$ROOT")
          cd "$DIR"

          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find project -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find project -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" toraco-key-V5.2.apk

      - name: Upload toraco-key V5.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: toraco-key-V5.2-APK
          path: toraco-key-V5.2.apk
